<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Golden Amber Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Metallic Edge Gradient -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#edgeGrad)" stroke-width="12" />

  <!-- Inner Subtle Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Mechanical Automotive Cog / Rotor Shield -->
  <g transform="translate(256, 256)" filter="url(#gearGlow)">
    <!-- 8 Cog Teeth -->
    <g fill="url(#goldGrad)">
      <rect x="-24" y="-170" width="48" height="40" rx="8" />
      <rect x="-24" y="130" width="48" height="40" rx="8" />
      <rect x="-170" y="-24" width="40" height="48" rx="8" />
      <rect x="130" y="-24" width="40" height="48" rx="8" />

      <g transform="rotate(45)">
        <rect x="-22" y="-170" width="44" height="40" rx="8" />
        <rect x="-22" y="130" width="44" height="40" rx="8" />
        <rect x="-170" y="-22" width="40" height="44" rx="8" />
        <rect x="130" y="-22" width="40" height="44" rx="8" />
      </g>
    </g>

    <!-- Main Outer Rotor Ring -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="36" />
    <!-- Inner Dark Hub -->
    <circle cx="0" cy="0" r="115" fill="#0f172a" stroke="#334155" stroke-width="6" />

    <!-- Stylized Turbo / Dynamic "E" Core (esyadak monogram) -->
    <!-- Top Bar of E -->
    <path d="M-45 -55 L50 -55 Q65 -55 65 -40 L65 -35 Q65 -20 50 -20 L-10 -20 L-10 -5 L35 -5 Q50 -5 50 10 L50 15 Q50 30 35 30 L-10 30 L-10 45 L50 45 Q65 45 65 60 L65 65 Q65 80 50 80 L-45 80 Q-65 80 -65 60 L-65 -35 Q-65 -55 -45 -55 Z" fill="url(#goldGrad)" />

    <!-- Center Precision Spark / Diamond -->
    <polygon points="12,-2 26,-16 40,-2 26,12" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Speed / Power Swoosh Accent -->
  <path d="M120 410 Q256 445 392 410" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />
</svg>
